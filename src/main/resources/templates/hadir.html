<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Data Siswa</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f0f0f0; }
        h2 { color: #6a1b9a; }
        .links { margin-bottom: 15px; }
        .links a {
            background: #6a1b9a; color: white;
            padding: 8px 15px; text-decoration: none;
            border-radius: 5px; margin-right: 10px;
        }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; }
        th { background: #6a1b9a; color: white; padding: 12px; text-align: left; }
        td { padding: 10px 12px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f9f0ff; }
        .hadir { color: green; font-weight: bold; }
        .tidak { color: red; }
        .btn-edit { background: #1976d2; color: white; padding: 5px 12px; border-radius: 4px; text-decoration: none; font-size: 13px; }
        .btn-hapus { background: #d32f2f; color: white; padding: 5px 12px; border-radius: 4px; text-decoration: none; font-size: 13px; margin-left: 5px; }
    </style>
</head>
<body>

<h2>Data Siswa</h2>
<div class="links">
    <a href="/siswa/hadir">📋 Halaman Absensi</a>
</div>

<table>
    <thead>
        <tr>
            <th>#</th>
            <th>Nama</th>
            <th>NIM</th>
            <th>Kelas</th>
            <th>Matakuliah</th>
            <th>Hadir</th>
            <th>Aksi</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="s, i : ${siswaList}">
            <td th:text="${i.count}"></td>
            <td th:text="${s.nama}"></td>
            <td th:text="${s.nim}"></td>
            <td th:text="${s.kelas}"></td>
            <td th:text="${s.matakuliah}"></td>
            <td th:class="${s.hadir} ? 'hadir' : 'tidak'"
                th:text="${s.hadir} ? 'Hadir' : 'Tidak Hadir'">
            </td>
            <td>
                <a th:href="@{/siswa/update/{id}(id=${s.id})} + '?nama=' + ${s.nama} + '&nim=' + ${s.nim} + '&kelas=' + ${s.kelas} + '&matakuliah=' + ${s.matakuliah} + '&hadir=' + ${!s.hadir}"
                class="btn-edit"
                th:text="${s.hadir} ? 'Set Tidak Hadir' : 'Set Hadir'">
                </a>
                <a th:href="@{/siswa/delete/{id}(id=${s.id})}"
                class="btn-hapus"
                onclick="return confirm('Hapus siswa ini?')">Hapus</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(siswaList)}">
            <td colspan="7" style="text-align:center; color:#aaa; padding:20px;">
                Belum ada data siswa. Tambah via:
                <code>/siswa/create?nama=X&nim=X&kelas=X&matakuliah=X&hadir=true</code>
            </td>
        </tr>
    </tbody>
</table>

</body>
</html>
